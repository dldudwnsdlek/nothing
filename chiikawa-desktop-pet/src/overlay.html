<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>overlay</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { user-select: none; -webkit-user-select: none; }
    #stage { position: fixed; inset: 0; }
    .pet { position: absolute; left: 0; top: 0; will-change: transform; pointer-events: none; }
    .pet-body { position: absolute; left: 50%; bottom: 4px; transform-origin: 50% 100%;
      pointer-events: auto; cursor: grab; line-height: 0; }
    .pet-body:active { cursor: grabbing; }
    .pet-body img { display: block; width: auto; -webkit-user-drag: none; }
    .fx { position: absolute; inset: 0; pointer-events: none; }
    .shadow { position: absolute; left: 50%; bottom: 0; width: 64px; height: 10px; border-radius: 50%;
      background: rgba(0,0,0,.14); transform-origin: 50% 50%; }
    .shadow.big { width: 130px; height: 16px; }
    .monster { position: absolute; left: 0; top: 0; will-change: transform; pointer-events: none; z-index: 900; }
    .monster-body { position: absolute; left: 50%; bottom: 4px; transform-origin: 50% 100%;
      pointer-events: auto; cursor: crosshair; line-height: 0; }
    .monster-body img { display: block; width: auto; -webkit-user-drag: none; }
    .hp { position: absolute; left: 50%; width: 110px; height: 10px; transform: translateX(-50%);
      background: #fff; border: 2px solid #4b3a3a; border-radius: 8px; overflow: hidden; transition: opacity .3s; }
    .hp-fill { height: 100%; width: 100%; background: linear-gradient(#ff8a8a, #e85d5d); transition: width .2s; }
    .monster .bubble { bottom: auto; }
    .pop { position: absolute; z-index: 3000; pointer-events: none; transform: translateX(-50%);
      font: 900 22px/1 "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #e85d5d;
      -webkit-text-stroke: 1.5px #fff; animation: pop .8s ease-out forwards; }
    @keyframes pop { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -40px; } }
    .food { position: absolute; left: 0; top: 0; z-index: 950; font-size: 32px; line-height: 36px; width: 36px;
      text-align: center; pointer-events: none; transform-origin: 50% 100%; will-change: transform; }
    .bubble {
      position: absolute; left: 50%; bottom: 100%; z-index: 2;
      transform: translate(-50%, 4px) scale(.6); opacity: 0;
      transition: opacity .15s, transform .15s;
      background: #fff; color: #4b3a3a; border: 2px solid #4b3a3a; border-radius: 14px;
      padding: 4px 10px; font: 700 13px/1.3 "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      white-space: nowrap; pointer-events: none;
    }
    .bubble::after {
      content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
      border: 6px solid transparent; border-top-color: #4b3a3a;
    }
    .bubble.show { opacity: 1; transform: translate(-50%, -2px) scale(1); }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script src="characters.js"></script>
  <script src="monster.js"></script>
  <script src="pets.js"></script>
</body>
</html>
